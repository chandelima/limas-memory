services:
  bot:
    build: .   # no `image:` here: with it, `compose pull` would try to download "limas-memory" from Docker Hub
    restart: unless-stopped
    # DNS used by the container. If the host's resolver is flaky ("Temporary failure in name resolution"),
    # list more than one: Docker tries them in order. Put your router's IP in DNS_PRIMARY if you prefer it.
    dns:
      - ${DNS_PRIMARY:-8.8.8.8}
      - ${DNS_SECONDARY:-1.1.1.1}
    # No env_file: Portainer (stack from a Git repository) has no .env in the checkout.
    # The values come from the environment of the stack (Portainer: "Environment variables";
    # locally: the .env next to this file, which Compose reads for the ${...} below).
    environment:
      TZ: ${TZ:-America/Recife}   # defines "today" for tasks; BRIEFING_TIME may carry its own zone
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      DOCUMENT_MODEL: ${DOCUMENT_MODEL:-}
      PDF_ENGINE: ${PDF_ENGINE:-}
      CURATOR_IDLE_SECONDS: ${CURATOR_IDLE_SECONDS:-600}
      BRIEFING_TIME: ${BRIEFING_TIME:-06:00}
      MEMORY_GIT_REMOTE: ${MEMORY_GIT_REMOTE:-}
      MEMORY_GIT_TOKEN: ${MEMORY_GIT_TOKEN:-}
      MEMORY_GIT_USER_NAME: ${MEMORY_GIT_USER_NAME:-}
      MEMORY_GIT_USER_EMAIL: ${MEMORY_GIT_USER_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID:-}
      LOG_CHANNEL_LEVEL: ${LOG_CHANNEL_LEVEL:-WARNING}
      LOG_CHANNEL_HEADER: ${LOG_CHANNEL_HEADER:-}
      WEB_SEARCH: ${WEB_SEARCH:-on}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-parallel}
      WEB_SEARCH_MODE: ${WEB_SEARCH_MODE:-turbo}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-3}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-}
      # container paths (they win over anything from outside)
      MEMORY_DIR: /memory
      CONVERSATION_FILE: /data/conversation.json
      BRIEFING_STATE_FILE: /data/briefing.json
      LANGUAGE_FILE: /data/language.json
    volumes:
      - memory:/memory   # git repository of the memory
      - data:/data       # conversation.json and briefing.json
    stop_grace_period: 40s   # lets a running curation finish (the bot waits up to 30 s)

volumes:
  memory:
  data:
